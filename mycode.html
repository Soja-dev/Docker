<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kicks · buy shoe</title>
  <!-- Font Awesome for cart & shoe icons (optional but nice) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #f7f9fc 0%, #e9eef4 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .product-card {
      max-width: 1000px;
      width: 100%;
      background: #ffffff;
      border-radius: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-wrap: wrap;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .product-card:hover {
      transform: scale(1.01);
    }

    /* left side – shoe visual */
    .product-visual {
      flex: 1 1 45%;
      background: radial-gradient(circle at 30% 30%, #f0f4fa, #d9e2ef);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
      position: relative;
    }

    .shoe-icon {
      font-size: 12rem;
      color: #1e2b3c;
      filter: drop-shadow(0 20px 20px rgba(0, 0, 0, 0.15));
      transition: all 0.3s;
      line-height: 1;
    }

    .badge {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      background: #f43f5e;
      color: white;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.4rem 1rem;
      border-radius: 50px;
      letter-spacing: 0.5px;
      box-shadow: 0 6px 12px rgba(244, 63, 94, 0.3);
    }

    /* right side – details & buy */
    .product-details {
      flex: 1 1 55%;
      padding: 2.8rem 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #ffffff;
    }

    .brand {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #5b6f88;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .product-title {
      font-size: 2.8rem;
      font-weight: 800;
      color: #0f1a2b;
      line-height: 1.1;
      margin-bottom: 0.75rem;
    }

    .product-title span {
      color: #2563eb;
      font-weight: 700;
    }

    .rating {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      color: #fbbf24;
    }

    .rating i {
      font-size: 1rem;
    }

    .rating .count {
      color: #64748b;
      font-size: 0.9rem;
      margin-left: 0.25rem;
      font-weight: 500;
    }

    .price-section {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .current-price {
      font-size: 2.4rem;
      font-weight: 800;
      color: #0f1a2b;
    }

    .old-price {
      font-size: 1.3rem;
      color: #94a3b8;
      text-decoration: line-through;
      font-weight: 500;
    }

    .discount {
      background: #dbeafe;
      color: #1e40af;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.3rem 1rem;
      border-radius: 30px;
      letter-spacing: 0.3px;
    }

    .description {
      color: #334155;
      line-height: 1.6;
      margin-bottom: 1.8rem;
      font-size: 1rem;
      border-left: 4px solid #2563eb;
      padding-left: 1rem;
      background: #f8fafc;
      padding: 1rem 1.2rem;
      border-radius: 0 14px 14px 0;
    }

    .size-selector {
      margin-bottom: 2rem;
    }

    .size-selector p {
      font-weight: 600;
      font-size: 0.9rem;
      color: #1e293b;
      margin-bottom: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sizes {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
    }

    .size-btn {
      background: #f1f5f9;
      border: 2px solid transparent;
      color: #1e293b;
      font-weight: 600;
      width: 3.2rem;
      height: 3.2rem;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.95rem;
    }

    .size-btn:hover {
      background: #e2e8f0;
      border-color: #94a3b8;
    }

    .size-btn.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
      box-shadow: 0 8px 14px -6px #2563eb80;
    }

    .buy-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      margin-top: 0.5rem;
    }

    .buy-btn {
      flex: 2 1 200px;
      background: #0f1a2b;
      border: none;
      color: white;
      font-weight: 700;
      font-size: 1.2rem;
      padding: 1.2rem 2rem;
      border-radius: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 18px 30px -10px #0f1a2b80;
      letter-spacing: 0.5px;
    }

    .buy-btn i {
      font-size: 1.3rem;
      transition: transform 0.2s;
    }

    .buy-btn:hover {
      background: #1e2b3c;
      transform: translateY(-3px);
      box-shadow: 0 24px 36px -12px #0f1a2bcc;
    }

    .buy-btn:hover i {
      transform: translateX(5px);
    }

    .buy-btn:active {
      transform: translateY(0);
      box-shadow: 0 10px 20px -8px #0f1a2b;
    }

    .wishlist-btn {
      flex: 1 0 60px;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      color: #1e293b;
      font-size: 1.4rem;
      padding: 1.1rem 0;
      border-radius: 3rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wishlist-btn:hover {
      background: #fef2f2;
      border-color: #f43f5e;
      color: #f43f5e;
    }

    .wishlist-btn i {
      transition: transform 0.2s;
    }

    .wishlist-btn:hover i {
      transform: scale(1.1);
    }

    /* small note / free shipping */
    .shipping-note {
      margin-top: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      color: #475569;
      font-size: 0.9rem;
      font-weight: 500;
      background: #f1f5f9;
      padding: 0.8rem 1.3rem;
      border-radius: 50px;
      width: fit-content;
    }

    .shipping-note i {
      color: #2563eb;
      font-size: 1.1rem;
    }

    /* responsiveness */
    @media (max-width: 700px) {
      .product-card {
        border-radius: 2rem;
      }
      .product-visual {
        padding: 2rem;
      }
      .shoe-icon {
        font-size: 8rem;
      }
      .product-details {
        padding: 2rem 1.8rem;
      }
      .product-title {
        font-size: 2.2rem;
      }
      .current-price {
        font-size: 2rem;
      }
      .buy-btn {
        font-size: 1rem;
        padding: 1rem 1.5rem;
      }
      .size-btn {
        width: 2.8rem;
        height: 2.8rem;
      }
      .shipping-note {
        font-size: 0.8rem;
        padding: 0.6rem 1rem;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 0.8rem;
      }
      .product-visual {
        padding: 1.5rem;
      }
      .shoe-icon {
        font-size: 6rem;
      }
      .product-details {
        padding: 1.8rem 1.2rem;
      }
      .product-title {
        font-size: 1.9rem;
      }
      .price-section {
        gap: 0.7rem;
      }
      .current-price {
        font-size: 1.8rem;
      }
      .buy-actions {
        gap: 0.7rem;
      }
      .buy-btn {
        font-size: 1rem;
        padding: 0.9rem 1.2rem;
        gap: 0.5rem;
      }
      .wishlist-btn {
        padding: 0.9rem 0;
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="product-card">
    <!-- left side: shoe visual -->
    <div class="product-visual">
      <div class="badge">🔥 best seller</div>
      <!-- using Font Awesome shoe icon as visual; you can replace with an <img> -->
      <i class="fas fa-shoe-prints shoe-icon"></i>
      <!-- alternative: solid shoe icon (font awesome 6) -->
      <!-- <i class="fas fa-shoe-prints shoe-icon"></i> -->
    </div>

    <!-- right side: product info + buy -->
    <div class="product-details">
      <div class="brand">STRIDE & CO.</div>
      <h1 class="product-title">
        Aero <span>Glide</span> X
      </h1>

      <div class="rating">
        <i class="fas fa-star"></i>
        <i class="fas fa-star"></i>
        <i class="fas fa-star"></i>
        <i class="fas fa-star"></i>
        <i class="fas fa-star-half-alt"></i>
        <span class="count">(4.8 · 2.3k reviews)</span>
      </div>

      <div class="price-section">
        <span class="current-price">$129.99</span>
        <span class="old-price">$189.99</span>
        <span class="discount">-32%</span>
      </div>

      <p class="description">
        Featherlight cushioning · breathable knit · high-rebound foam. 
        Designed for daily runs & all-day comfort.
      </p>

      <!-- size selector (interactive with js) -->
      <div class="size-selector">
        <p>Select size (US)</p>
        <div class="sizes" id="sizeContainer">
          <button class="size-btn active" data-size="7">7</button>
          <button class="size-btn" data-size="7.5">7.5</button>
          <button class="size-btn" data-size="8">8</button>
          <button class="size-btn" data-size="8.5">8.5</button>
          <button class="size-btn" data-size="9">9</button>
          <button class="size-btn" data-size="9.5">9.5</button>
          <button class="size-btn" data-size="10">10</button>
          <button class="size-btn" data-size="10.5">10.5</button>
          <button class="size-btn" data-size="11">11</button>
        </div>
      </div>

      <!-- buy actions -->
      <div class="buy-actions">
        <button class="buy-btn" id="buyNowBtn">
          <i class="fas fa-shopping-bag"></i> Buy now
        </button>
        <button class="wishlist-btn" id="wishlistBtn" aria-label="Add to wishlist">
          <i class="far fa-heart"></i>
        </button>
      </div>

      <!-- extra trust note -->
      <div class="shipping-note">
        <i class="fas fa-truck-fast"></i> Free shipping & 30‑day returns
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ---------- SIZE SELECTION ----------
      const sizeContainer = document.getElementById('sizeContainer');
      const sizeButtons = document.querySelectorAll('.size-btn');
      let selectedSize = '7'; // default active

      sizeButtons.forEach(btn => {
        btn.addEventListener('click', function(e) {
          // remove active from all
          sizeButtons.forEach(b => b.classList.remove('active'));
          // add active to clicked
          this.classList.add('active');
          // update selected size
          selectedSize = this.dataset.size;
          console.log(`Size selected: US ${selectedSize}`);
        });
      });

      // ---------- BUY NOW ----------
      const buyBtn = document.getElementById('buyNowBtn');
      buyBtn.addEventListener('click', function(e) {
        // simple buy action (can be replaced with real checkout)
        const productName = 'Aero Glide X';
        const price = '$129.99';
        alert(`🛒 Added to cart!\n\n${productName} — US ${selectedSize} · ${price}\n\n(Proceed to checkout – demo)`);
        // you can redirect or open cart drawer here
        // e.g. window.location.href = '/checkout?product=aero-glide-x&size=' + selectedSize;
      });

      // ---------- WISHLIST (toggle heart) ----------
      const wishlistBtn = document.getElementById('wishlistBtn');
      const heartIcon = wishlistBtn.querySelector('i');
      let isWishlisted = false;

      wishlistBtn.addEventListener('click', function() {
        isWishlisted = !isWishlisted;
        if (isWishlisted) {
          heartIcon.classList.remove('far');
          heartIcon.classList.add('fas');
          heartIcon.style.color = '#f43f5e';
          // optional: change button background
          wishlistBtn.style.background = '#fef2f2';
          wishlistBtn.style.borderColor = '#f43f5e';
          // small feedback (optional)
          // alert('❤️ Added to wishlist!');
        } else {
          heartIcon.classList.remove('fas');
          heartIcon.classList.add('far');
          heartIcon.style.color = '';
          wishlistBtn.style.background = '#ffffff';
          wishlistBtn.style.borderColor = '#e2e8f0';
        }
      });

      // ---------- (optional) hover on buy button already in css ----------
      // ---------- dynamic badge for demo purpose only ----------
      console.log('👟 Shoe purchase UI ready — select size & buy!');
    })();
  </script>

  <!-- small note: icon fallback for shoe (font awesome) -->
  <noscript>Your browser does not support JavaScript — but you can still view the shoe.</noscript>
</body>
</html>
